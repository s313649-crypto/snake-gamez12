<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典復古貪食蛇 - 五關挑戰</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }

        #game-container {
            display: flex;
            gap: 20px;
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #canvas-wrapper {
            position: relative;
        }

        canvas {
            border: 4px solid #4CAF50;
            background-color: #111;
        }

        #status-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-box {
            background: #444;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .info-box h3 {
            margin: 0 0 10px 0;
            color: #FFD700;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        .info-item {
            font-size: 18px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        #leaderboard-list {
            padding-left: 20px;
            margin: 5px 0;
        }

        #leaderboard-list li {
            margin: 5px 0;
            color: #ddd;
        }

        /* 彈出視窗樣式 */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .modal h2 {
            color: #FFD700;
            margin-bottom: 15px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>豪華版貪食蛇：五關寶石挑戰</h1>

    <div id="game-container">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="gameModal" class="modal">
                <h2 id="modalTitle">遊戲開始</h2>
                <p id="modalText">準備好挑戰第 1 關了嗎？</p>
                <div id="highScoreInputZone" style="display: none;">
                    <p>恭喜榮登排行榜！請輸入名字：</p>
                    <input type="text" id="playerName" maxlength="10" placeholder="你的名字"><br>
                </div>
                <button id="modalBtn" onclick="handleModalClick()">開始遊戲</button>
            </div>
        </div>

        <div id="status-panel">
            <div class="info-box">
                <h3>目前狀態</h3>
                <div class="info-item"><span>關卡:</span> <span id="level">1 / 5</span></div>
                <div class="info-item"><span>分數:</span> <span id="score">0</span></div>
                <div class="info-item"><span>時間:</span> <span id="timer">0s</span></div>
                <div class="info-item"><span>剩餘寶石:</span> <span id="gemsLeft">3</span></div>
            </div>

            <div class="info-box">
                <h3>前五名排行榜</h3>
                <ol id="leaderboard-list">
                    <li>暫無資料</li>
                    <li>暫無資料</li>
                    <li>暫無資料</li>
                    <li>暫無資料</li>
                    <li>暫無資料</li>
                </ol>
            </div>
            
            <p style="font-size: 12px; color: #aaa; text-align: center; margin: 0;">操作方式：鍵盤方向鍵</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲地圖設定
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // 遊戲變數
        let snake = [];
        let dx = gridSize; // 初始向右移動
        let dy = 0;
        let gems = [];     // 畫面上所有的寶石位置
        let score = 0;
        let level = 1;
        let timeElapsed = 0;
        let gemsRequiredToWin = 0;
        let gemsEatenInLevel = 0;

        // 定時器變數
        let gameInterval = null;
        let timerInterval = null;
        let gameSpeed = 120; // 毫秒 (越小越快)

        // 狀態控管: 'START', 'NEXT_LEVEL', 'GAME_OVER', 'WIN_ALL'
        let gameState = 'START'; 

        // 初始化載入
        window.onload = function() {
            updateLeaderboardView();
            showModal('START');
        };

        // 監聽鍵盤事件
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            // 防止反向自殺
            if (keyPressed === 37 && !goingRight) { dx = -gridSize; dy = 0; }
            if (keyPressed === 38 && !goingDown) { dx = 0; dy = -gridSize; }
            if (keyPressed === 39 && !goingLeft) { dx = gridSize; dy = 0; }
            if (keyPressed === 40 && !goingUp) { dx = 0; dy = gridSize; }
        }

        // 初始化某一關卡
        function initLevel(lvl) {
            level = lvl;
            // 關卡規則：第1關3個寶石，之後每關多2個 (3, 5, 7, 9, 11)
            gemsRequiredToWin = 3 + (level - 1) * 2;
            gemsEatenInLevel = 0;

            // 蛇的初始位置 (置中)
            snake = [
                {x: 10 * gridSize, y: 10 * gridSize},
                {x: 9 * gridSize, y: 10 * gridSize},
                {x: 8 * gridSize, y: 10 * gridSize}
            ];
            dx = gridSize;
            dy = 0;

            // 生成該關卡所需的所有寶石
            gems = [];
            for (let i = 0; i < gemsRequiredToWin; i++) {
                gems.push(getRandomFoodPosition());
            }

            updateUI();
        }

        // 啟動定時器
        function startLoop() {
            if (gameInterval) clearInterval(gameInterval);
            if (timerInterval) clearInterval(timerInterval);

            // 每關速度稍微提升一點點
            let currentSpeed = gameSpeed - (level * 8); 

            gameInterval = setInterval(gameLoop, currentSpeed);
            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById("timer").innerText = timeElapsed + "s";
            }, 1000);
        }

        // 暫停定時器
        function stopLoop() {
            clearInterval(gameInterval);
            clearInterval(timerInterval);
        }

        // 遊戲主循環
        function gameLoop() {
            if (hasGameEnded()) {
                stopLoop();
                gameState = 'GAME_OVER';
                showModal('GAME_OVER');
                return;
            }

            moveSnake();
            checkFoodCollision();
            drawGrid();
        }

        // 繪製地圖
        function drawGrid() {
            // 清空畫布
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫蛇
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#4CAF50' : '#81C784'; // 頭深綠，身體淺綠
                ctx.strokeStyle = '#111';
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
                ctx.strokeRect(part.x, part.y, gridSize, gridSize);
            });

            // 畫寶石 (金黃色)
            gems.forEach(gem => {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                let centerX = gem.x + gridSize / 2;
                let centerY = gem.y + gridSize / 2;
                let radius = gridSize / 2 - 2;
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        // 移動蛇
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            snake.pop(); // 先移除尾巴，若吃到食物會再補回來
        }

        // 檢查是否吃到寶石
        function checkFoodCollision() {
            for (let i = 0; i < gems.length; i++) {
                if (snake[0].x === gems[i].x && snake[0].y === gems[i].y) {
                    // 吃到寶石
                    score += 10 * level; // 越後面的關卡分數越高
                    gemsEatenInLevel++;
                    
                    // 讓蛇長大 (把移除的尾巴補回去的感覺，直接再複製一份尾巴壓底)
                    snake.push({ ...snake[snake.length - 1] });

                    // 移除這顆寶石
                    gems.splice(i, 1);
                    
                    // 檢查是否過關
                    if (gems.length === 0) {
                        stopLoop();
                        if (level < 5) {
                            gameState = 'NEXT_LEVEL';
                            showModal('NEXT_LEVEL');
                        } else {
                            gameState = 'WIN_ALL';
                            showModal('WIN_ALL');
                        }
                    }
                    
                    updateUI();
                    break;
                }
            }
        }

        // 碰撞檢查
        function hasGameEnded() {
            // 撞牆
            if (snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height) {
                return true;
            }
            // 撞自己
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        // 隨機取得寶石座標
        function getRandomFoodPosition() {
            let foodX, foodY;
            while (true) {
                foodX = Math.floor(Math.random() * tileCount) * gridSize;
                foodY = Math.floor(Math.random() * tileCount) * gridSize;
                
                // 確保寶石不會生在蛇身上
                let onSnake = snake.some(part => part.x === foodX && part.y === foodY);
                // 確保不會跟已經存在的寶石重疊
                let onGems = gems.some(gem => gem.x === foodX && gem.y === foodY);

                if (!onSnake && !onGems) break;
            }
            return {x: foodX, y: foodY};
        }

        // 更新右側數據看板
        function updateUI() {
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText = level + " / 5";
            document.getElementById("gemsLeft").innerText = gems.length;
        }

        // 控制彈出視窗(Modal)的內容
        function showModal(type) {
            const modal = document.getElementById("gameModal");
            const title = document.getElementById("modalTitle");
            const text = document.getElementById("modalText");
            const btn = document.getElementById("modalBtn");
            const inputZone = document.getElementById("highScoreInputZone");

            modal.style.display = "flex";
            inputZone.style.display = "none";

            if (type === 'START') {
                title.innerText = "經典貪食蛇 5關挑戰";
                text.innerText = "用鍵盤方向鍵控制。吃完地圖上所有寶石即可晉級！";
                btn.innerText = "開始第 1 關";
            } else if (type === 'NEXT_LEVEL') {
                title.innerText = `第 ${level} 關成功突破！`;
                text.innerText = `目前得分：${score} \n下一關將會有更多寶石！`;
                btn.innerText = `進入第 ${level + 1} 關`;
            } else if (type === 'GAME_OVER') {
                title.innerText = "GAME OVER";
                text.innerText = `很遺憾，你撞到了！最終得分：${score}`;
                if (checkIsHighScore(score)) {
                    inputZone.style.display = "block";
                    btn.innerText = "送出名字並重新開始";
                } else {
                    btn.innerText = "再試一次";
                }
            } else if (type === 'WIN_ALL') {
                title.innerText = "全關卡制霸！🏆";
                text.innerText = `太強了！你完成了所有關卡！\n總花費時間：${timeElapsed}秒\n最終得分：${score}`;
                if (checkIsHighScore(score)) {
                    inputZone.style.display = "block";
                    btn.innerText = "送出名字並紀錄排行";
                } else {
                    btn.innerText = "重新挑戰";
                }
            }
        }

        // 點擊彈窗按鈕的邏輯處理
        function handleModalClick() {
            const modal = document.getElementById("gameModal");
            const nameInput = document.getElementById("playerName");

            // 如果有開啟名字輸入區，表示需要存檔
            if (document.getElementById("highScoreInputZone").style.display === "block") {
                let name = nameInput.value.trim() || "匿名對手";
                saveScore(name, score);
                nameInput.value = ""; // 清空
            }

            modal.style.display = "none";

            if (gameState === 'START') {
                score = 0;
                timeElapsed = 0;
                document.getElementById("timer").innerText = "0s";
                initLevel(1);
                startLoop();
            } else if (gameState === 'NEXT_LEVEL') {
                initLevel(level + 1);
                startLoop();
            } else if (gameState === 'GAME_OVER' || gameState === 'WIN_ALL') {
                // 重新回到第一關
                score = 0;
                timeElapsed = 0;
                document.getElementById("timer").innerText = "0s";
                initLevel(1);
                startLoop();
            }
        }

        /* --- 排行榜邏輯 (LocalStorage) --- */
        function getLeaderboard() {
            let board = localStorage.getItem("snake_leaderboard");
            return board ? JSON.parse(board) : [];
        }

        function checkIsHighScore(currentScore) {
            if (currentScore === 0) return false;
            let board = getLeaderboard();
            if (board.length < 5) return true;
            return currentScore > board[board.length - 1].score;
        }

        function saveScore(name, currentScore) {
            let board = getLeaderboard();
            board.push({name: name, score: currentScore, date: new Date().toLocaleDateString()});
            // 從大到小排序
            board.sort((a, b) => b.score - a.score);
            // 只取前五名
            board = board.slice(0, 5);
            localStorage.setItem("snake_leaderboard", JSON.stringify(board));
            updateLeaderboardView();
        }

        function updateLeaderboardView() {
            let board = getLeaderboard();
            const listItems = document.querySelectorAll("#leaderboard-list li");
            
            for (let i = 0; i < 5; i++) {
                if (board[i]) {
                    listItems[i].innerText = `${board[i].name} - ${board[i].score}分`;
                } else {
                    listItems[i].innerText = "暫無資料";
                }
            }
        }
    </script>
</body>
</html>
